[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hb1d"
version = "0.1.0"
description = "Exact search for heavy-ball cycles on one-dimensional smooth strongly convex functions outside the augmented root-of-unity region (evidence for the 1D consequence of the Fotopoulos et al. conjecture; Pasechnyuk-Vilensky's fan orbits in dimension one)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
keywords = ["heavy-ball method", "momentum", "cycles", "non-acceleration", "interpolation", "Farkas certificates",
            "exact verification", "linear programming", "Lur'e systems", "Zames-Falb"]
dependencies = ["numpy>=2.0", "scipy>=1.14", "mpmath>=1.3", "sympy>=1.13", "matplotlib>=3.9"]

[project.urls]
Repository = "https://github.com/AbdulazizHGA/hb1d-cycles"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
