name: Full certificate check

# Manual only (Actions tab -> "Full certificate check" -> Run workflow), e.g. before a release.
# Re-checks EVERY stored certificate, including the K = 13, 14 Farkas files that the per-push workflow skips
# (about 1 to 2 hours; uses that many Actions minutes).
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[test]"
      - name: Interval-arithmetic certificates (Omega_aug, mixed condition)
        run: python scripts/verify_rigorous.py
      - name: All exact Farkas certificates (named tunings K = 3..14 and grid cells)
        shell: bash   # bash -eo pipefail: a failing check is not hidden by tee's exit status
        run: python scripts/verify_certificates.py certificates/*.farkas.gz certificates/grid/*.farkas.gz | tee verify.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-certificate-check
          path: verify.log
