name: Python

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test]"
      - run: pytest -q
      - name: Re-check the interval-arithmetic certificates (Omega_aug, mixed condition)
        run: python scripts/verify_rigorous.py
      - name: Re-check the exact Farkas certificates with K <= 12 (all files are checked by reproduce.sh)
        run: python scripts/verify_certificates.py --max-k 12 certificates/*.farkas.gz certificates/grid/*.farkas.gz
